<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wi-Fi Ayarları - Kuvoz</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="keyboard.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script src="socket.io.min.js"></script>
    <script src="keyboard.js"></script>
    <script src="script.js?v=20260201v2"></script>
    <style>
        .wifi-container {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
        }

        .status-card {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            color: white;
            padding: 30px;
            border-radius: 15px;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        .status-info {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-top: 20px;
        }

        .message-box {
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            text-align: center;
            font-weight: 600;
            display: none;
            animation: slideDown 0.3s ease;
        }

        .message-success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .message-error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        @keyframes slideDown {
            from {
                transform: translateY(-10px);
                opacity: 0;
            }

            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .status-indicator {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: #ff4444;
        }

        .status-indicator.connected {
            background: #00ff00;
            box-shadow: 0 0 10px #00ff00;
        }

        .network-list {
            background: white;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            margin-bottom: 30px;
        }

        .network-item {
            padding: 20px;
            border-bottom: 1px solid #eee;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: background 0.3s;
            cursor: pointer;
        }

        .network-item:hover {
            background: #f9f9f9;
        }

        .network-info {
            display: flex;
            flex-direction: column;
        }

        .ssid {
            font-weight: 600;
            font-size: 18px;
            color: #333;
        }

        .signal {
            font-size: 14px;
            color: #666;
        }

        .action-buttons {
            display: flex;
            gap: 15px;
            margin-top: 20px;
        }

        .btn {
            padding: 15px 25px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-primary {
            background: #4facfe;
            color: white;
        }

        .btn-wps {
            background: #764ba2;
            color: white;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 15px;
            width: 90%;
            max-width: 400px;
        }

        input[type="password"] {
            width: 100%;
            padding: 12px;
            margin: 20px 0;
            border: 2px solid #ddd;
            border-radius: 8px;
            box-sizing: border-box;
        }

        .back-btn {
            position: fixed;
            top: 20px;
            left: 20px;
            background: white;
            color: #4facfe;
            border: 2px solid #4facfe;
            padding: 10px 20px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
        }

        .loading-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.9);
            z-index: 2000;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #4facfe;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body>
    <a href="index.html" class="back-btn"><span data-i18n="button.back">← Geri</span></a>

    <div class="wifi-container">
        <div id="msgBox" class="message-box"></div>

        <div class="status-card">
            <h2 data-i18n="wifi.status_title">📶 Wi-Fi Ayarları</h2>
            <p data-i18n="wifi.status_desc">Kuvoz cihazını yerel ağınıza bağlayın</p>
            <div class="status-info">
                <div id="statusIndicator" class="status-indicator"></div>
                <div>
                    <strong data-i18n="wifi.status">Durum:</strong> <span id="statusText"
                        data-i18n="sensor.reading">Kontrol ediliyor...</span>
                    <br>
                    <small id="ipText"></small>
                </div>
            </div>
        </div>

        <div class="action-buttons">
            <button class="btn btn-primary" onclick="scanWifi()" data-i18n="wifi.scan_networks">🔄 Ağları Tara</button>
            <button class="btn btn-wps" onclick="startWps()" data-i18n="wifi.wps_match">🔘 VPS / WPS Eşleşme</button>
            <button id="disconnectBtn" class="btn" style="display:none; background:#ff4444; color:white;"
                onclick="disconnectWifi()" data-i18n="wifi.disconnect">❌ Bağlantıyı Kes</button>
        </div>

        <h3 style="margin-top:30px;" data-i18n="wifi.available_networks">📡 Mevcut Ağlar</h3>
        <div id="networkList" class="network-list">
            <div style="padding:20px; text-align:center; color:#999;" data-i18n="wifi.scan_prompt">Ağları taramak için
                butona basın</div>
        </div>
    </div>

    <!-- Password Modal -->
    <div id="passwordModal" class="modal">
        <div class="modal-content">
            <h3 id="modalSsid" data-i18n="wifi.connect_to">Ağa Bağlan</h3>
            <input type="password" id="wifiPassword" placeholder="Wi-Fi Şifresi" data-i18n-placeholder="wifi.password">
            <div class="action-buttons">
                <button class="btn btn-primary" style="flex:1" onclick="connectWifi()"
                    data-i18n="wifi.connect">Bağlan</button>
                <button class="btn" style="flex:1; background:#eee;" onclick="closeModal()"
                    data-i18n="system.cancel">İptal</button>
            </div>
        </div>
    </div>

    <!-- Loading Overlay -->
    <div id="loadingOverlay" class="loading-overlay">
        <div class="spinner"></div>
        <p id="loadingMsg" style="margin-top:20px; font-weight:600; color:#4facfe;" data-i18n="remote.loading">İşlem
            yapılıyor...</p>
    </div>

    <script>
        const socket = io();
        let selectedSsid = '';
        let wifiActionTimer = null;
        let pendingWifiAction = null;
        let wpsAwaitingFinal = false;

        socket.on('connect', () => {
            console.log('Connected to server');
            // Do NOT hide loading here if an action is pending.
            // Let the action timeout or completion response handle it.
            if (pendingWifiAction === 'wps' || wpsAwaitingFinal) {
                showLoading('WPS eşleşmesi devam ediyor... Lütfen bekleyin.');
            }
            refreshStatus();
        });

        socket.on('disconnect', () => {
            console.log('Socket disconnected');
            // Keep the loading overlay visible if we are in the middle of a Wi-Fi action.
            // It's expected to lose connection briefly when Wi-Fi state changes.
            if (pendingWifiAction) {
                const msg = pendingWifiAction === 'wps' ? 
                    'WPS eşleşmesi devam ediyor... Bağlantı yenileniyor.' : 
                    'Ağ değişimi algılandı... Bağlantı yenileniyor.';
                showLoading(msg);
            }
        });

        function beginWifiAction(action, message, timeoutMs = 30000) {
            pendingWifiAction = action;
            showLoading(message);
            if (wifiActionTimer) clearTimeout(wifiActionTimer);
            wifiActionTimer = setTimeout(() => {
                if (!pendingWifiAction) return;
                hideLoading();
                showMessage('İşlem zaman aşımına uğradı. Lütfen tekrar deneyin.', 'error');
                pendingWifiAction = null;
                refreshStatus();
            }, timeoutMs);
        }

        function endWifiAction() {
            if (wifiActionTimer) {
                clearTimeout(wifiActionTimer);
                wifiActionTimer = null;
            }
            pendingWifiAction = null;
            hideLoading();
        }

        function refreshStatus() {
            socket.emit('wifi_status');
        }

        function scanWifi() {
            beginWifiAction('scan', window.kuvozController.t('wifi.scanning'), 25000);
            socket.emit('wifi_scan');
        }

        function startWps() {
            if (confirm(window.kuvozController.t('wifi.wps_confirm'))) {
                wpsAwaitingFinal = true;
                beginWifiAction('wps', window.kuvozController.t('wifi.wps_start'), 130000);
                socket.emit('wifi_wps_pbc');
            }
        }

        function disconnectWifi() {
            if (confirm(window.kuvozController.t('wifi.disconnect_confirm'))) {
                if (!socket.connected) {
                    showMessage('Sunucu bağlantısı yok. Sayfayı yenileyip tekrar deneyin.', 'error');
                    refreshStatus();
                    return;
                }
                beginWifiAction('disconnect', window.kuvozController.t('wifi.disconnecting'), 12000);
                socket.emit('wifi_disconnect');
            }
        }

        socket.on('wifi_status_response', (data) => {
            const indicator = document.getElementById('statusIndicator');
            const statusText = document.getElementById('statusText');
            const ipText = document.getElementById('ipText');
            const disconnectBtn = document.getElementById('disconnectBtn');

            if (data.connected) {
                indicator.classList.add('connected');
                statusText.innerText = window.kuvozController.t('wifi.connected') + ': ' + data.ssid;
                ipText.innerText = 'IP: ' + data.ip;
                disconnectBtn.style.display = 'block';
            } else {
                indicator.classList.remove('connected');
                statusText.innerText = window.kuvozController.t('wifi.not_connected');
                ipText.innerText = '';
                disconnectBtn.style.display = 'none';
            }
        });

        socket.on('wifi_scan_response', (data) => {
            endWifiAction();
            const list = document.getElementById('networkList');
            list.innerHTML = '';

            if (data.success && data.networks.length > 0) {
                data.networks.forEach(net => {
                    const item = document.createElement('div');
                    item.className = 'network-item';
                    item.onclick = () => openModal(net.ssid);

                    item.innerHTML = `
                        <div class="network-info">
                            <span class="ssid">${net.ssid}</span>
                            <span class="signal">${window.kuvozController.t('wifi.status')}: ${net.signal}% (${net.bars})</span>
                        </div>
                        <span style="color:#4facfe; font-weight:bold;">→</span>
                    `;
                    list.appendChild(item);
                });
            } else {
                list.innerHTML = '<div style="padding:20px; text-align:center; color:#ff4444;">' + window.kuvozController.t('wifi.no_networks') + '</div>';
            }
        });

        socket.on('wifi_connect_response', (data) => {
            endWifiAction();
            showMessage(data.message, data.success ? 'success' : 'error');
            if (data.success) {
                setTimeout(refreshStatus, 2000);
            }
        });

        socket.on('wifi_wps_response', (data) => {
            const stage = data.stage || 'final';
            if (stage === 'started') {
                // Keep spinner visible until final result arrives.
                wpsAwaitingFinal = true;
                showLoading(data.message || 'WPS işlemi devam ediyor...');
                return;
            }
            wpsAwaitingFinal = false;
            endWifiAction();
            showMessage(data.message, data.success ? 'success' : 'error');
            setTimeout(refreshStatus, 1000);
        });

        socket.on('wifi_disconnect_response', (data) => {
            endWifiAction();
            showMessage(data.message, data.success ? 'success' : 'error');
            refreshStatus();
        });

        socket.on('wifi_connect_progress', (data) => {
            showLoading(data.message);
        });

        socket.on('wifi_wps_progress', (data) => {
            showLoading(data.message);
        });

        function openModal(ssid) {
            selectedSsid = ssid;
            document.getElementById('modalSsid').innerText = ssid + ' ' + window.kuvozController.t('wifi.connect_to');
            document.getElementById('wifiPassword').value = '';
            document.getElementById('passwordModal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('passwordModal').style.display = 'none';
        }

        function connectWifi() {
            const password = document.getElementById('wifiPassword').value;
            closeModal();
            beginWifiAction('connect', selectedSsid + ' ' + window.kuvozController.t('wifi.connecting'), 45000);
            socket.emit('wifi_connect', { ssid: selectedSsid, password: password });
        }

        function showLoading(msg) {
            document.getElementById('msgBox').style.display = 'none'; // Clear old message
            document.getElementById('loadingMsg').innerText = msg;
            document.getElementById('loadingOverlay').style.display = 'flex';
        }

        function hideLoading() {
            document.getElementById('loadingOverlay').style.display = 'none';
        }

        function showMessage(text, type) {
            const box = document.getElementById('msgBox');
            box.innerText = text;
            box.className = 'message-box message-' + type;
            box.style.display = 'block';

            // Auto hide after 10 seconds if success
            if (type === 'success') {
                setTimeout(() => {
                    box.style.display = 'none';
                }, 10000);
            }
        }

        // Initialize KuvozController
        document.addEventListener('DOMContentLoaded', () => {
            if (!window.kuvozController) {
                window.kuvozController = new KuvozController();
            }
            // Add support for data-i18n-placeholder
            const applyPlaceholders = () => {
                document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
                    const key = el.getAttribute('data-i18n-placeholder');
                    el.placeholder = window.kuvozController.t(key);
                });
            };
            applyPlaceholders();
            window.addEventListener('languageChanged', applyPlaceholders);
        });
    </script>
</body>

</html>
