<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kuvoz Incubator Control System</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/3.1.4/socket.io.js"></script>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header class="header">
            <h1><i class="fas fa-seedling"></i> Kuvoz Incubator Control System</h1>
            <div class="status-bar">
                <span class="connection-status" id="connectionStatus">
                    <i class="fas fa-wifi"></i> Connected
                </span>
                <span class="datetime" id="datetime"></span>
            </div>
        </header>

        <div class="main-content">
            <!-- Sensor Panel -->
            <section class="sensor-panel">
                <h2><i class="fas fa-thermometer-half"></i> Sensors</h2>
                <div class="sensor-grid">
                    <div class="sensor-card temperature">
                        <i class="fas fa-thermometer-half"></i>
                        <h3>Temperature</h3>
                        <div class="sensor-value" id="temperature">--°C</div>
                        <div class="sensor-status" id="tempStatus">Reading...</div>
                    </div>
                    
                    <div class="sensor-card humidity">
                        <i class="fas fa-tint"></i>
                        <h3>Humidity</h3>
                        <div class="sensor-value" id="humidity">--%</div>
                        <div class="sensor-status" id="humStatus">Reading...</div>
                    </div>
                    
                    <div class="sensor-card oxygen">
                        <i class="fas fa-wind"></i>
                        <h3>Oxygen</h3>
                        <div class="sensor-value" id="oxygen">--%</div>
                        <div class="sensor-status" id="oxyStatus">Reading...</div>
                    </div>
                </div>
            </section>

            <!-- Control Panel -->
            <section class="control-panel">
                <h2><i class="fas fa-sliders-h"></i> Controls</h2>
                <div class="control-grid">
                    <!-- GPIO Buttons -->
                    <div class="button-group">
                        <h3>GPIO Controls</h3>
                        <div class="button-grid">
                            <button class="control-btn" data-pin="5" data-name="b1" id="btn_b1">
                                <i class="fas fa-lightbulb"></i>
                                <span>Lighting</span>
                            </button>
                            <button class="control-btn" data-pin="6" data-name="b2" id="btn_b2">
                                <i class="fas fa-spray-can"></i>
                                <span>Nebulizer</span>
                            </button>
                            <button class="control-btn" data-pin="13" data-name="b3" id="btn_b3">
                                <i class="fas fa-tint"></i>
                                <span>Humidity</span>
                            </button>
                            <button class="control-btn" data-pin="16" data-name="b4" id="btn_b4">
                                <i class="fas fa-fire"></i>
                                <span>Carbon Temp</span>
                            </button>
                            <button class="control-btn" data-pin="19" data-name="b5" id="btn_b5">
                                <i class="fas fa-thermometer"></i>
                                <span>IR Temp</span>
                            </button>
                            <button class="control-btn" data-pin="20" data-name="b6" id="btn_b6">
                                <i class="fas fa-fan"></i>
                                <span>Fan</span>
                            </button>
                            <button class="control-btn" data-pin="21" data-name="b7" id="btn_b7">
                                <i class="fas fa-sun"></i>
                                <span>UV Light</span>
                            </button>
                            <button class="control-btn" data-pin="26" data-name="b8" id="btn_b8">
                                <i class="fas fa-atom"></i>
                                <span>Ozone</span>
                            </button>
                        </div>
                    </div>

                    <!-- Sliders -->
                    <div class="slider-group">
                        <h3>Settings</h3>
                        <div class="slider-grid">
                            <div class="slider-item">
                                <label for="sld1">Nebulizer Interval (min)</label>
                                <input type="range" id="sld1" min="1" max="60" value="30" class="slider">
                                <span class="slider-value" id="sld1_value">30</span>
                            </div>
                            
                            <div class="slider-item">
                                <label for="sld2">Humidity Target (%)</label>
                                <input type="range" id="sld2" min="40" max="90" value="65" class="slider">
                                <span class="slider-value" id="sld2_value">65</span>
                            </div>
                            
                            <div class="slider-item">
                                <label for="sld3">Temperature Target (°C)</label>
                                <input type="range" id="sld3" min="20" max="40" value="25" class="slider">
                                <span class="slider-value" id="sld3_value">25.0</span>
                            </div>
                            
                            <div class="slider-item">
                                <label for="sld4">IR Temperature Target (°C)</label>
                                <input type="range" id="sld4" min="20" max="40" value="25" class="slider">
                                <span class="slider-value" id="sld4_value">25.0</span>
                            </div>
                            
                            <div class="slider-item">
                                <label for="sld5">Ozone Interval (min)</label>
                                <input type="range" id="sld5" min="1" max="60" value="30" class="slider">
                                <span class="slider-value" id="sld5_value">30</span>
                            </div>
                            
                            <div class="slider-item">
                                <label for="sld6">Nebulizer Hours Interval</label>
                                <input type="range" id="sld6" min="1" max="24" value="12" class="slider">
                                <span class="slider-value" id="sld6_value">12</span>
                            </div>
                            
                            <div class="slider-item">
                                <label for="sld7">Ozone Hours Interval</label>
                                <input type="range" id="sld7" min="1" max="15" value="8" class="slider">
                                <span class="slider-value" id="sld7_value">8.0</span>
                            </div>
                        </div>
                    </div>
                </div>
            </section>

            <!-- System Panel -->
            <section class="system-panel">
                <h2><i class="fas fa-cogs"></i> System</h2>
                <div class="system-controls">
                    <button class="system-btn shutdown" id="shutdownBtn">
                        <i class="fas fa-power-off"></i>
                        <span>Shutdown</span>
                    </button>
                    <button class="system-btn restart" id="restartBtn">
                        <i class="fas fa-redo"></i>
                        <span>Restart</span>
                    </button>
                    <button class="system-btn save" id="saveBtn">
                        <i class="fas fa-save"></i>
                        <span>Save Settings</span>
                    </button>
                </div>
            </section>
        </div>

        <!-- Footer -->
        <footer class="footer">
            <p>&copy; 2025 Kuvoz Incubator Control System v3.0 - Web Interface</p>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
